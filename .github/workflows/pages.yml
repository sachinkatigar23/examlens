# The read-only static demo on GitHub Pages: https://sachinkatigar23.github.io/examlens/
# Built from client/ with VITE_STATIC_DEMO (npm run build:pages): no server, the data is the JSON exported into
# client/public/static-demo/ by scripts/export-static-demo.mjs. One-time setup: Settings → Pages → Source:
# "GitHub Actions". Optional: a repository variable DEMO_VIDEO_URL adds a "Watch the video" link to the banner.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_DEMO_VIDEO_URL: ${{ vars.DEMO_VIDEO_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
