server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind Caddy (docker-compose.prod.yml) the visitor's IP arrives in X-Forwarded-For. Trust it only from
    # the private Docker network, so the server's per-IP limits see the visitor, not Caddy. (Without a proxy in
    # front, as in docker-compose.yml, nobody sends that header and nothing changes.)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # API: same origin for the browser, so no CORS and the refresh cookie just works.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ask answers stream as Server-Sent Events: pass every chunk through immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1200s;  # a CPU-only server can think for minutes before the first word
        client_max_body_size 21m;  # PDFs up to 20 MB
    }

    # Built assets have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path is a React Router route.
    location / {
        try_files $uri /index.html;
    }
}
