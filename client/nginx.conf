server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: same origin for the browser, so no CORS and the refresh cookie just works.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ask answers stream as Server-Sent Events: pass every chunk through immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 21m;  # PDFs up to 20 MB
    }

    # Built assets have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path is a React Router route.
    location / {
        try_files $uri /index.html;
    }
}
